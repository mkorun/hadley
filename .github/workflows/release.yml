# A release, started by pushing the tag v<version>, the version of packages/hadley/package.json; any other tag stops
# it. The gate runs on three systems, and the programs of hadley are built and tried on each system they are for
# (check.yml); then one Linux job builds, without any write permission, the comments service for Linux and macOS
# (scripts/build-forms.ts: archives and SHA256SUMS) and the npm package (scripts/pack.ts: dist/). Two jobs publish them,
# each in the environment release, which waits for the human's approval: the GitHub release of the tag, with the
# programs, install.sh, the archives, one SHA256SUMS over them and a build provenance attestation of them; and the
# package staged on npm by trusted publishing (OIDC, no token; npm adds its own provenance, and needs npm 11.15 and
# Node.js 22.14.0 or later, which Node.js 24.18.0 brings), where it is published when a maintainer approves it with 2FA.
# A version with a `-` is a prerelease on GitHub and goes to npm under the dist-tag next, which staging fixes. Every
# action is pinned to a commit.
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          version=$(jq -r .version packages/hadley/package.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'the tag %s is not v%s, the version of packages/hadley/package.json\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  check:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: hadley
    steps:
      # below the workspace, so that the mise.toml of the tools leaves the checkout as the commit has it, which
      # build-forms.ts requires
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hadley
          persist-credentials: false
      - uses: ./hadley/.github/actions/tools
        timeout-minutes: 10
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: mise exec go -- bun scripts/build-forms.ts "$RUNNER_TEMP/forms"
        timeout-minutes: 20
      - run: bun scripts/pack.ts
        timeout-minutes: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: forms
          path: ${{ runner.temp }}/forms
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: package
          path: hadley/dist
          if-no-files-found: error

  github:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: forms
          path: forms
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: binaries
          path: binaries
      - run: |
          (cd forms && sha256sum --check --strict SHA256SUMS)
          (cd binaries && sha256sum --check --strict SHA256SUMS)
          mkdir release
          mv forms/*.tar.gz binaries/hadley-* binaries/install.sh binaries/THIRD_PARTY_LICENSES release/
          sort -k 2 forms/SHA256SUMS binaries/SHA256SUMS > release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        timeout-minutes: 5
        with:
          subject-path: release/*
      - run: |
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          notes="The changes are in [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md).
          A file of the release is checked with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "$notes" "${flags[@]}"
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}

  npm:
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # for the tools only; the package is the one the build job made
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/tools
        timeout-minutes: 10
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: package
          path: dist
      - run: |
          if [[ "$PRERELEASE" == true ]]; then npm stage publish --tag next; else npm stage publish; fi
        working-directory: dist
        timeout-minutes: 5
        env:
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
