# The gate (check.sh, docs/typescript.md "Gate") on every push to main and every pull request, with the tools at the
# versions the project uses, through mise as check.sh runs them: Bun, Node.js at the lowest version hadley supports
# (docs/adr/0001-runtimes.md), Go for the comments service; then the smoke test (scripts/smoke.ts), which builds a
# small site with a fresh clone and with the package as npm installs it, each on Bun and on Node.js. One job on Linux,
# and a new push cancels the run before it. Every action is pinned to a commit.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.8.5
          mise_toml: |
            [tools]
            bun = "1.4.0"
            node = "24.18.0"
            go = "1.27.3"
      - run: sudo apt-get install -y libimage-exiftool-perl fonts-noto-core
        timeout-minutes: 5
      - run: bun install --frozen-lockfile
        timeout-minutes: 5
      - run: ./check.sh
        timeout-minutes: 15
      - run: bun scripts/smoke.ts
        timeout-minutes: 15
